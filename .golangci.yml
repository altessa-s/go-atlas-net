version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - bidichk
    - bodyclose
    - contextcheck
    - dogsled
    - errcheck
    - prealloc
    - mnd
    - unconvert
    - asciicheck
    - exhaustive
    - copyloopvar
    - modernize
    - goconst
    - whitespace
    - gocritic
    - godox
    - goprintffuncname
    - govet
    - unused
    - lll
    - makezero
    - misspell
    - nilnil
    - noctx
    - staticcheck
    - predeclared
    - unparam
    - ineffassign
    - dupl
    - gocyclo
    - gocognit
  settings:
    lll:
      line-length: 156
    gocyclo:
      min-complexity: 30
    gocognit:
      min-complexity: 30
    dogsled:
      max-blank-identifiers: 2
    errcheck:
      check-type-assertions: true
      check-blank: false
    exhaustive:
      default-signifies-exhaustive: true
      package-scope-only: false
    goconst:
      min-len: 3
      match-constant: true
      numbers: true
    staticcheck:
      checks: ["all", "-ST1003"]
    mnd:
      ignored-functions:
        - strings.SplitN
        - strconv.*
        - make
    govet:
      enable-all: true
      disable:
        - fieldalignment
    makezero:
      always: false
    misspell:
      locale: US
  exclusions:
    generated: lax
    paths:
      - ".*_test\\.go"

formatters:
  enable:
    - gci
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(google.golang.org)
        - prefix(golang.org)
        - prefix(github.com/altessa-s/go-atlas-core)
        - prefix(github.com/altessa-s/go-atlas-net)
        - prefix(github.com/altessa-s)
        - blank
        - alias
