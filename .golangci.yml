version: "2"

run:
  timeout: 5m
  # Lint the tests behind these tags too; they build only with them.
  build-tags:
    - integration

linters:
  default: none
  enable:
    - bidichk
    - bodyclose
    - contextcheck
    - dogsled
    - errcheck
    - prealloc
    - mnd
    - unconvert
    - asciicheck
    - exhaustive
    - copyloopvar
    - modernize
    - goconst
    - whitespace
    - gocritic
    - godox
    - goprintffuncname
    - govet
    - unused
    - lll
    - makezero
    - misspell
    - nilnil
    - noctx
    - staticcheck
    - predeclared
    - unparam
    - ineffassign
    - dupl
    - gocyclo
    - gocognit
    - wsl_v5
    - godoclint
  settings:
    lll:
      line-length: 156
    gocyclo:
      min-complexity: 30
    gocognit:
      min-complexity: 30
    dogsled:
      max-blank-identifiers: 2
    errcheck:
      check-type-assertions: true
      check-blank: false
    exhaustive:
      default-signifies-exhaustive: true
      package-scope-only: false
    goconst:
      min-len: 3
      match-constant: true
      numbers: true
    staticcheck:
      checks: ["all", "-ST1003"]
    mnd:
      ignored-functions:
        - strings.SplitN
        - strconv.*
        - make
    govet:
      enable-all: true
      disable:
        - fieldalignment
    makezero:
      always: false
    misspell:
      locale: US
    godoclint:
      default: basic
      enable:
        - require-doc
  exclusions:
    generated: lax
    rules:
      # Tests run only the formatting, dead-code and simple correctness
      # linters (see CONTRIBUTING "Formatting"); every other linter skips them.
      - path: _test\.go
        linters:
          - bidichk
          - bodyclose
          - contextcheck
          - dogsled
          - errcheck
          - prealloc
          - mnd
          - unconvert
          - exhaustive
          - goconst
          - gocritic
          - godox
          - govet
          - lll
          - makezero
          - nilnil
          - noctx
          - staticcheck
          - unparam
          - dupl
          - gocyclo
          - gocognit
          - godoclint

formatters:
  enable:
    - gci
  exclusions:
    # make generate formats optgen's output with these formatters, so the
    # generated files are held to them too.
    generated: disable
  settings:
    gci:
      # Keep the sections in the order listed here; by default gci sorts
      # prefix sections lexically.
      custom-order: true
      sections:
        - standard
        - default
        - prefix(google.golang.org)
        - prefix(golang.org)
        - prefix(github.com/altessa-s)
        - prefix(github.com/altessa-s/go-atlas-net)
        - blank
        - alias
