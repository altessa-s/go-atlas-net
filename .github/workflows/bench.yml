name: Benchmarks

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Benchmark regression
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base branch is checked out into a worktree for comparison.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Compare benchmarks against the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
          # Shared runners are noisy: only a significant increase above
          # BENCH_THRESHOLD fails. The script's header documents its defaults.
          BENCH_REPORT: benchstat.txt
        run: bash .github/scripts/bench-regression.sh "origin/${BASE_REF}"

      - name: Upload benchstat report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchstat
          path: benchstat.txt
          if-no-files-found: ignore
          retention-days: 14
